  <section id="contact" class="py-20 bg-blue-700 text-white">
    <div class="container mx-auto text-center">
      <h2 class="text-4xl font-bold mb-6">Get in Touch</h2>
      <form id="contactForm" class="max-w-lg mx-auto">
        <input type="text" class="form-control mb-4" placeholder="Your Name" required>

        <textarea class="form-control mb-4" placeholder="Your Message" rows="4" required></textarea>
        <button type="submit" class="px-6 py-3 bg-yellow-500 hover:bg-yellow-600 rounded-lg shadow-lg">Send Message</button>
      </form>
    </div>
  </section>
